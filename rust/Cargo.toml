[package]
name = "semantic-dom-ssg"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["George Alexander <info@gorgalxandr.com>"]
description = "Machine-readable web semantics for AI agents. O(1) lookup, deterministic navigation, token-efficient serialization."
license = "MIT"
repository = "https://github.com/gorgalxandr/semantic-dom-ssg"
documentation = "https://docs.rs/semantic-dom-ssg"
readme = "README.md"
keywords = ["semantic-dom", "ai-agent", "web-automation", "accessibility", "llm"]
categories = ["web-programming", "accessibility", "parsing"]

[lib]
name = "semantic_dom_ssg"
path = "src/lib.rs"

[[bin]]
name = "semantic-dom"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
# HTML parsing
scraper = { version = "0.29", default-features = false }
# Same versions scraper is built on: used for depth-limited incremental
# parsing and non-recursive tree traversal.
html5ever = "0.40"
ego-tree = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.6", features = ["derive"], optional = true }

# URL validation
url = "2.5"

# Hashing for O(1) lookup
ahash = { version = "0.8", features = ["serde"] }

# Error handling
thiserror = "2.0"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
strip = true
